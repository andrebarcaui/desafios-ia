<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desafios de IA: demonstração</title>
<style>
  html, body { margin: 0; height: 100%; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; background: #172033; color: #EEF1EC; }
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; padding: .55rem 1rem; }
  .barra b { font-size: 1rem; }
  .barra .info { font-size: .85rem; opacity: .8; flex: 1; min-width: 16rem; }
  .barra code { background: #F4C430; color: #172033; padding: 0 .35rem; border-radius: 3px; font-weight: 700; }
  .abas { display: flex; gap: .3rem; }
  .abas button, .reiniciar { font: inherit; font-weight: 700; font-size: .9rem; border: 2px solid #EEF1EC; background: transparent; color: #EEF1EC; padding: .35rem .8rem; border-radius: 6px; cursor: pointer; }
  .abas button[aria-selected=true] { background: #F4C430; border-color: #F4C430; color: #172033; }
  .reiniciar { border-color: rgba(238,241,236,.4); font-weight: 400; }
  .quadros { position: absolute; top: 3.2rem; left: 0; right: 0; bottom: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #EEF1EC; }
  iframe[hidden] { display: block; visibility: hidden; }
  @media (max-width: 760px) { .quadros { top: 6rem; } }
</style>
</head>
<body>
<div class="barra">
  <b>Demonstração</b>
  <div class="abas" role="tablist" id="abas">
    <button role="tab" aria-selected="true" data-aba="aluno1">Grupo 1</button>
    <button role="tab" aria-selected="false" data-aba="aluno2">Grupo 2</button>
    <button role="tab" aria-selected="false" data-aba="professor">Professor</button>
    <button role="tab" aria-selected="false" data-aba="telao">Telão</button>
  </div>
  <span class="info">Você joga como Grupo 1 (<code>DEMO-1</code>, supervisionado) e Grupo 2 (<code>DEMO-2</code>, clustering). Senha do professor: <code>020271</code>. Grupos 3 a 6 simulados.</span>
  <button class="reiniciar" type="button" id="reiniciar">Reiniciar demonstração</button>
</div>
<div class="quadros" id="quadros"></div>
<script>/*__STATS__*/</script>
<script>/*__CORE__*/</script>
<script>/*__DADOS__*/</script>
<script>
(function () {
  try { ['desafios.sessao.aluno1', 'desafios.sessao.aluno2', 'desafios.professor'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
  var ids = Object.keys(CASOS_COMPLETOS);
  /* Um caso diferente por grupo, alternando supervisionado e clustering */
  var preferidos = ['fuga-silenciosa', 'tamanho-unico', 'sinistro-perfeito', 'lojas-sem-perfil', 'patrocinador-fantasma', 'assinantes-invisiveis'];
  var sup = ids.filter(function (id) { return CASOS_COMPLETOS[id]._modelo.tipo !== 'agrupamento'; });
  var agr = ids.filter(function (id) { return CASOS_COMPLETOS[id]._modelo.tipo === 'agrupamento'; });
  var ordem = preferidos.filter(function (id) { return CASOS_COMPLETOS[id]; });
  for (var i = 0; ordem.length < 6; i++) ordem.push((i % 2 ? agr : sup)[Math.floor(i / 2) % (i % 2 ? agr : sup).length] || ids[0]);
  var grupos = ordem.slice(0, 6).map(function (caso, i) { return { codigo: 'DEMO-' + (i + 1), nome: 'Grupo ' + (i + 1), caso: caso }; });
  var SENHA = '020271', mem = {};
  var store = { get: function (k) { return mem[k] ? JSON.parse(mem[k]) : null; }, set: function (k, v) { mem[k] = JSON.stringify(v); }, del: function (k) { delete mem[k]; } };
  window.DEMO_CASOS_PUBLICOS = DEMO_CASOS_PUBLICOS;
  var S = ServerCore.create({ store: store, casos: CASOS_COMPLETOS, config: { chaveProfessor: SENHA, grupos: grupos } });
  /* Antes de o professor mudar de fase, os grupos simulados que ainda não jogaram jogam na hora. */
  window.DEMO_SERVIDOR = { handle: function (req) { if (req && req.acao === 'prof_fase' && req.chave === SENHA) jogarPendentes(); return S.handle(req); } };

  /* ----- Grupos simulados ----- */
  var perfis = {
    'DEMO-3': { p: 0.85, ruim: true, compra: ['m1', 'm2'], membros: ['Larissa', 'Otávio', 'Beatriz'] },
    'DEMO-4': { p: 0.6, ruim: false, escalaErrada: true, compra: ['m4'], membros: ['Rafael', 'Júlia', 'Henrique', 'Sofia'] },
    'DEMO-5': { p: 0.9, ruim: false, compra: ['m1'], membros: ['Camila', 'Diego'] },
    'DEMO-6': { p: 0.75, ruim: true, compra: ['m2'], membros: ['Paula', 'Tiago', 'Renata'] }
  };
  var agenda = {};
  function casoDe(c) { return CASOS_COMPLETOS[grupos.filter(function (g) { return g.codigo === c; })[0].caso]; }
  function sorte(p) { return Math.random() < p; }
  function melhor(gab) { return Object.keys(gab).reduce(function (a, b) { return gab[b] > gab[a] ? b : a; }); }
  function escolher(gab, p) {
    var m = melhor(gab), outros = Object.keys(gab).filter(function (x) { return x !== m; });
    return sorte(p) ? m : outros[Math.floor(Math.random() * outros.length)];
  }
  function respostasBot(codigo, faseId) {
    var pf = perfis[codigo], caso = casoDe(codigo), fase = caso.fases.filter(function (f) { return f.id === faseId; })[0], R = {};
    var est = S.handle({ acao: 'estado', codigo: codigo }), cen = null;
    if (est.evento) Object.keys(caso._evento).forEach(function (k) { if (caso._evento[k].titulo === est.evento.titulo) cen = k; });
    var bons = caso.caixas[0].id, ruins = caso.caixas[1].id;
    fase.itens.forEach(function (it) {
      if (it.tipo === 'escolha') {
        var gab = it._gabarito || (cen ? caso._evento[cen]._gabarito[it.id] : null);
        if (gab) R[it.id] = escolher(gab, pf.p);
        if (pf.escalaErrada && caso._modelo.padroniza && it.id === caso._modelo.padroniza.item) R[it.id] = 'a';
      } else if (it.tipo === 'texto') R[it.id] = 'Resposta do grupo simulado.';
      else if (it.tipo === 'cartas') {
        var m = {}, caixas = caso.caixas.map(function (c) { return c.id; });
        it.cartas.forEach(function (c) { m[c.id] = sorte(pf.p) ? c._gabarito : caixas[Math.floor(Math.random() * 4)]; if (c._gabarito === ruins && m[c.id] === bons) m[c.id] = 'descartar'; });
        if (pf.ruim) { var armadilha = it.cartas.filter(function (c) { return c._gabarito === ruins; })[0]; if (armadilha) m[armadilha.id] = bons; }
        R[it.id] = m;
      } else if (it.tipo === 'simulador') R[it.id] = { pct: pf.p > 0.7 ? 3 + Math.round(Math.random() * 5) : 10 + Math.round(Math.random() * 12) };
      else if (it.tipo === 'agrupamento') R[it.id] = { k: Number(escolher(it._gabarito, pf.p)) };
    });
    return R;
  }
  function jogar(codigo, faseId) {
    var R = respostasBot(codigo, faseId);
    if (faseId === 'f2') perfis[codigo].compra.forEach(function (id) { S.handle({ acao: 'comprar', codigo: codigo, fonteId: id }); });
    if (faseId === 'f3') S.handle({ acao: 'treinar', codigo: codigo, respostas: R });
    S.handle({ acao: 'enviar', codigo: codigo, faseId: faseId, respostas: R });
  }
  function executar(k, c, fid) {
    var a = agenda[k]; if (!a || a.feito) return;
    a.feito = true; clearTimeout(a.t);
    try { jogar(c, fid); } catch (e) {}
  }
  function faseAtual() { return ServerCore.FASES[S.handle({ acao: 'prof_placar', chave: SENHA }).fase]; }
  function jogarPendentes() {
    var fid = faseAtual();
    if (['f1', 'f2', 'f3', 'evento'].indexOf(fid) < 0) return;
    Object.keys(perfis).forEach(function (c) { if (!agenda[c + fid]) agenda[c + fid] = { c: c, f: fid }; executar(c + fid, c, fid); });
  }
  setInterval(function () {
    var fid = faseAtual();
    if (['f1', 'f2', 'f3', 'evento'].indexOf(fid) < 0) return;
    Object.keys(perfis).forEach(function (c) {
      var k = c + fid;
      if (agenda[k]) return;
      agenda[k] = { t: setTimeout(function () { executar(k, c, fid); }, 5000 + Math.random() * 20000), c: c, f: fid };
    });
  }, 1500);
  Object.keys(perfis).forEach(function (c, i) {
    setTimeout(function () { S.handle({ acao: 'entrar', codigo: c, membros: perfis[c].membros }); }, 1500 + i * 1700);
  });

  /* ----- Abas ----- */
  var quadros = document.getElementById('quadros'), abas = document.getElementById('abas'), ifr = {};
  function criar(nome, pagina, nomeJanela) {
    var f = document.createElement('iframe');
    f.title = nome; f.name = nomeJanela || nome; f.srcdoc = PAGINAS[pagina]; f.hidden = true;
    quadros.appendChild(f); ifr[nome] = f;
    return f;
  }
  function mostrar(nome) {
    abas.querySelectorAll('[data-aba]').forEach(function (x) { x.setAttribute('aria-selected', x.dataset.aba === nome ? 'true' : 'false'); });
    for (var k in ifr) ifr[k].hidden = k !== nome;
  }
  criar('aluno1', 'aluno'); criar('aluno2', 'aluno'); criar('professor', 'professor'); criar('telao', 'telao');
  abas.addEventListener('click', function (e) { var b = e.target.closest('[data-aba]'); if (b) mostrar(b.dataset.aba); });
  window.DEMO_ESPIAR = function (codigo, nome) {
    var id = 'espiar-' + codigo;
    if (!ifr[id]) {
      criar(id, 'espiar', 'espiar:' + codigo);
      var b = document.createElement('button');
      b.setAttribute('role', 'tab'); b.dataset.aba = id; b.textContent = 'Tela do ' + nome;
      abas.appendChild(b);
    }
    mostrar(id);
  };
  mostrar('aluno1');
  document.getElementById('reiniciar').addEventListener('click', function () { location.reload(); });
})();
</script>
</body>
</html>
